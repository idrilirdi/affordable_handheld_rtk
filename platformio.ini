; RTK GNSS rover -> phone over Bluetooth LE.
;
; NMEA out and RTCM3 corrections in, over Nordic UART; see README.md and
; docs/PROTOCOL.md.

[platformio]
default_envs = xiao_esp32c6

[env]
; The ESP32-C6 needs Arduino core 3.x, which ships in the pioarduino fork of
; platform-espressif32.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
	-DCORE_DEBUG_LEVEL=0
	; allow a diagnostic client alongside the survey app
	-DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
lib_deps = h2zero/NimBLE-Arduino@^2.5.1

; --------------------------------------------------------------------------
; Seeed XIAO ESP32-C6 - the target hardware
; --------------------------------------------------------------------------
[env:xiao_esp32c6]
board = seeed_xiao_esp32c6
; The default table leaves 1.25 MB for the application and reserves a second
; slot for OTA, which this firmware does not use - and WiFi plus the captive
; portal does not fit in 1.25 MB. huge_app spends the OTA slot on the
; application instead: 3 MB, on a board with 4 MB of flash.
board_build.partitions = huge_app.csv
build_flags =
	${env.build_flags}
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DGNSS_UART_NUM=1
	-DPIN_GNSS_RX=17
	-DPIN_GNSS_TX=16
	-DLED_ACTIVE_LOW=1

; --------------------------------------------------------------------------
; Bench build: advertising while connected, portal always on
; --------------------------------------------------------------------------
; Lets a second client attach for diagnostics while the survey app holds the
; link, which is the only way to watch the stream during a failure the app is
; reporting. Not for field use: an app that keeps scanning will try to connect
; to a device it already holds, which is why the default build stops
; advertising. See config.h.
[env:xiao_esp32c6_debug]
extends = env:xiao_esp32c6
build_flags =
	${env:xiao_esp32c6.build_flags}
	-DADVERTISE_WHILE_CONNECTED=1
	-DPROV_ALWAYS_ON=1
